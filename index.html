<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" width="device-width">
		<link rel="stylesheet" href="style.css">
		<script src="script.js" defer></script>
	</head>
<body>
    <div class="container">
        <header>
            <h1>Suomen Sanakirja</h1>
            <p class="subtitle">Kirjoita suomen kielen sanat ja näytä ne taulukossa!</p>
        </header>
        
        <div class="content">
            <div class="input-section">
                <div class="input-group">
                    <input type="text" id="userInput" placeholder="Kirjoita sana tässä..." autocomplete="off" autofocus>
                    <!-- Removed the submit button -->
                </div>
                
                <div class="message" id="message">Kirjoita oikea sana aloittaaksesi!</div>
                
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="total-count">0</div>
                        <div class="stat-label">Yhteensä</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="found-count">0</div>
                        <div class="stat-label">Löytyneet</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="remaining-count">50</div>
                        <div class="stat-label">Jäljellä</div>
                    </div>
                </div>
            </div>
            
            <div class="table-container">
                <table id="wordTable">
                    <!-- Table will be generated by JavaScript -->
                </table>
            </div>
        </div>
        
        <footer>
            <p>Suomen kielen sanat - Quiz-sovellus</p>
        </footer>
    </div>
</html>
